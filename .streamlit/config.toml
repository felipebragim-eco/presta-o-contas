[theme]
# Cor principal (botões primários, checkboxes, radios e destaques)
primaryColor = "#0fcc2f"

# Cor de fundo da área principal
backgroundColor = "#F7F9F8"

# Cor de fundo dos campos de texto, uploaders e caixas expansíveis
secondaryBackgroundColor = "#E6EFEA"

# Cor principal dos textos
textColor = "#16241C"

# Fonte do aplicativo ("sans serif", "serif" ou "monospace")
font = "sans serif"
